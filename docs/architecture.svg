<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Miniature Worlds architecture">
  <rect width="960" height="420" fill="#14110e"/>
  <style>
    text { font-family: ui-sans-serif, Helvetica, Arial, sans-serif; fill: #f6efe2; }
    .box { fill: #2a2118; stroke: #e3b15a; stroke-width: 1.5; }
    .soft { fill: #1c1814; stroke: #8a7350; stroke-width: 1; }
    .label { font-size: 13px; font-weight: 600; }
    .sub { font-size: 11px; fill: #d9c7a4; }
    .arrow { stroke: #e3b15a; stroke-width: 1.4; fill: none; }
  </style>

  <text x="32" y="36" class="label" style="font-size:16px">Miniature Worlds</text>
  <text x="32" y="56" class="sub">One SpriteKit scene, two app targets. Motion is sampled only while the scene is active.</text>

  <rect class="soft" x="32" y="84" width="170" height="64" rx="10"/>
  <text x="48" y="110" class="label">iOS app</text>
  <text x="48" y="130" class="sub">SwiftUI · SpriteView</text>

  <rect class="soft" x="32" y="164" width="170" height="64" rx="10"/>
  <text x="48" y="190" class="label">watchOS app</text>
  <text x="48" y="210" class="sub">SwiftUI · crown</text>

  <rect class="box" x="250" y="112" width="190" height="88" rx="10"/>
  <text x="266" y="144" class="label">ContentView</text>
  <text x="266" y="164" class="sub">clock overlay, settings</text>
  <text x="266" y="182" class="sub">scenePhase pauses both</text>

  <rect class="box" x="488" y="84" width="200" height="72" rx="10"/>
  <text x="504" y="112" class="label">TiltMotionProvider</text>
  <text x="504" y="132" class="sub">CMMotionManager · 30/60 Hz</text>
  <text x="504" y="148" class="sub">or crown / drag</text>

  <rect class="box" x="488" y="176" width="200" height="72" rx="10"/>
  <text x="504" y="204" class="label">GameScene</text>
  <text x="504" y="224" class="sub">tray, obstacles, pile</text>
  <text x="504" y="240" class="sub">physicsWorld.gravity</text>

  <rect class="box" x="736" y="112" width="192" height="136" rx="10"/>
  <text x="752" y="140" class="label">WorldRegistry</text>
  <text x="752" y="164" class="sub">Treasure Chest</text>
  <text x="752" y="184" class="sub">Tennis Court</text>
  <text x="752" y="204" class="sub">Basketball Court</text>
  <text x="752" y="228" class="sub">+ new MiniatureWorld</text>

  <path class="arrow" d="M202 116 H250"/>
  <path class="arrow" d="M202 196 H226 V156 H250"/>
  <path class="arrow" d="M440 140 H488"/>
  <path class="arrow" d="M440 172 H488"/>
  <path class="arrow" d="M688 120 H736"/>
  <path class="arrow" d="M688 196 H712 V180 H736"/>

  <text x="32" y="280" class="sub">scenePhase .active  →  start motion, unpause SpriteKit</text>
  <text x="32" y="300" class="sub">inactive / background (wrist down)  →  stop CMMotionManager, pause the scene</text>
  <text x="32" y="332" class="label">Gravity</text>
  <text x="32" y="354" class="sub">Device gravity (gx, gy) in g, +x right, +y toward the top of the screen.</text>
  <text x="32" y="374" class="sub">Smoothed, then physicsWorld.gravity = (gx, gy) × scale. Z is ignored, so a flat face rests.</text>
  <text x="32" y="400" class="sub">Hard wall hits → rate-limited WKInterfaceDevice click on watch, light impact on iPhone.</text>
</svg>
